*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--page);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--page);color:var(--t1);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

.sheet.nofoot .sh-body{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.sh-top .tm{font-size:20px}

.sh-br{margin-top:4px;font:13px/1.4 var(--mono);color:var(--t3);overflow-wrap:anywhere}
.sh-hd{margin:14px 0 0;font-size:17px;line-height:1.45;color:var(--t1);text-wrap:pretty;overflow-wrap:anywhere}
.props{margin:20px 0 0;border-top:1px solid var(--line)}

.rep .mono{font-size:12px;color:var(--t3)}
.rchip{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--s2);color:var(--t2)}
.rchip.ok{background:var(--k-tint);color:var(--k)}
.rchip.bad{background:var(--w-tint);color:var(--w)}

.sh-foot{flex:none;padding:12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);border-top:1px solid var(--line)}
.pr{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;background:var(--brand);color:var(--brand-text);font-size:17px;font-weight:600;text-decoration:none}
.pr:hover{color:var(--brand-text)}
.pr:active{opacity:.85}

@keyframes pulse{50%{background-color:var(--w-pulse)}}
@keyframes breathe{50%{opacity:.4}}
@media (prefers-reduced-motion:no-preference){
  .chip[data-state=waiting]{animation:pulse 1.8s ease-in-out infinite}
  .hl-i.pulse{animation:breathe 1.8s ease-in-out infinite}
}

async function wakeOn(){
  if(!NATIVE_WAKE){videoOn();return}
  try{
    wake.lock=await navigator.wakeLock.request('screen');
    wake.lock.addEventListener('release',function(){wake.lock=null;wakeUI()});
  }catch(e){wake.lock=null;videoOn()}
  wakeUI();
}
function wakeOff(){
  wake.want=false;
  if(wake.lock){var l=wake.lock;wake.lock=null;try{l.release()}catch(e){}}
  if(wake.vid){wake.vid.pause();wake.vidOn=false}
  wakeUI();
}
wakeBtn.addEventListener('click',function(){
  if(wake.lock||wake.vidOn)wakeOff();
  else{wake.want=true;wakeOn()}
  lsSet(LS_WAKE,wake.want?'1':'0');
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  if(wake.want&&!wake.lock&&!wake.vidOn)wakeOn();
  poll();
});

/* ---------- start ---------- */
if(wake.want)wakeOn();
render();
if(S.mode==='mock')setScen(S.scen);
poll();
setInterval(tick,1000);
})();
